            var lang = new URLSearchParams(location.search).get("lang") || "en";
            if (!/^[a-z-]+$/i.test(lang)) lang = "en";
            document.documentElement.lang = lang === "jp" ? "ja" : lang;

                var link = document.createElement("link");
                link.rel = "preload";
                link.as = "fetch";
                link.crossOrigin = "anonymous";
                link.href = "./i18n/" + lang + ".json";
                document.head.appendChild(link);
            }
        })();

            </div>
            <div class="footer__col">
                <h2 id="footer-contact-title" class="footer__heading"></h2>
                <ul id="footer-contact" class="footer__list">
                    <li class="skeleton skeleton-fill" style="--sk-w: 14em;" aria-hidden="true"></li>
                </ul>
            </div>
            <div class="footer__col">
                <h2 id="footer-social-title" class="footer__heading"></h2>
                <nav id="footer-links" class="footer__links">
                    <span class="skeleton skeleton-icon" aria-hidden="true"></span>
                    <span class="skeleton skeleton-icon" aria-hidden="true"></span>
                    <span class="skeleton skeleton-icon" aria-hidden="true"></span>
                </nav>
                <a id="footer-cv" class="button button--primary footer__cv" download hidden></a>
            </div>
        </div>
        <p id="footer-copy" class="footer__copy"></p>
    </footer>

    <template id="game-carousel">
        <div class="carousel" data-carousel>
            <div class="carousel-viewport">
                <div class="carousel-img-cnt" img-cnt></div>
            </div>

            <div class="carousel-thumbs">
                <div class="carousel-thumbs-track" thumb-cnt></div>
                <div class="carousel-thumb-scroll">
                    <button class="left" data-prev aria-label="Scroll thumbnails left">‹</button>
                    <div class="carousel-thumb-scroll-track">
                        <div class="carousel-thumb-scroll-handle"></div>
                    </div>
                    <button class="right" data-next aria-label="Scroll thumbnails right">›</button>
                </div>
            </div>

            <div class="carousel-arrows">
                <button class="arrow left" data-prev aria-label="Previous"><span>‹</span></button>
                <div class="carousel-dots" dot-cnt></div>
                <button class="arrow right" data-next aria-label="Next"><span>›</span></button>
            </div>
        </div>
    </template>

    <template id="popup-skeleton">
        <div class="skeleton-exp skeleton-popup" aria-hidden="true">
            <span class="skeleton skeleton-line skeleton-title-line" style="--sk-w: 10em;"></span>
            <span class="skeleton skeleton-line skeleton-text" style="--sk-w: 8em;"></span>
            <div class="skeleton-exp-body">
                <span class="skeleton skeleton-media"></span>
                <div class="skeleton-stack">
                    <span class="skeleton skeleton-line skeleton-text"></span>
                    <span class="skeleton skeleton-line skeleton-text"></span>
                    <span class="skeleton skeleton-line skeleton-text" style="--sk-w: 70%;"></span>
                </div>
            </div>
        </div>
    </template>

    <script type="module" src="./src/js/core/App.js"></script>
    <script src="./src/js/particles/particles.js" defer></script>

</body>
</html>
