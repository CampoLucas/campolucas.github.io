<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucas Campo - Portfolio</title>
    <link rel="icon" type="image/svg" href="./src/media/icons/favicon.svg" />

    <script>
        (function () {
            var lang = new URLSearchParams(location.search).get("lang") || "en";
            if (!/^[a-z-]+$/i.test(lang)) lang = "en";
            document.documentElement.lang = lang === "jp" ? "ja" : lang;

            if (lang !== "en") {
                var link = document.createElement("link");
                link.rel = "preload";
                link.as = "fetch";
                link.crossOrigin = "anonymous";
                link.href = "./i18n/" + lang + ".json";
                document.head.appendChild(link);
            }
        })();
    </script>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://img.itch.zone">
    <link rel="preconnect" href="https://cdn.fastly.steamstatic.com">

    <link href="./src/css/foundation/variables.css" rel="stylesheet" />
    <link href="./src/css/foundation/typography.css" rel="stylesheet" />
    <link href="./src/css/layout/layout.css" rel="stylesheet" />
    <link href="./src/css/components/buttons.css" rel="stylesheet" />
    <link href="./src/css/components/icons.css" rel="stylesheet" />

    <link href="./src/css/components/carousel.css" rel="stylesheet" />
    <link href="./src/css/components/carousel-projects.css" rel="stylesheet" />
    <link href="./src/css/components/project-card.css" rel="stylesheet" />
    <link href="./src/css/components/asset-grid.css" rel="stylesheet" />
    <link href="./src/css/components/side-nav.css" rel="stylesheet" />
    <link href="./src/css/components/skeleton.css" rel="stylesheet" />
    <link href="./src/css/components/separator.css" rel="stylesheet" />
    <link href="./src/css/sections/hero.css" rel="stylesheet" />
    <link href="./src/css/sections/projects.css" rel="stylesheet" />
    <link href="./src/css/sections/experience.css" rel="stylesheet" />
    <link href="./src/css/sections/featured.css" rel="stylesheet" />
    <link href="./src/css/sections/showcases.css" rel="stylesheet" />
    <link href="./src/css/sections/footer.css" rel="stylesheet" />
    <link href="./src/css/sections/popup.css" rel="stylesheet" />
    <link href="./src/css/sections/skills.css" rel="stylesheet" />
    <link href="./src/css/effects/particles.css" rel="stylesheet" />

    <link rel="modulepreload" href="./src/js/core/App.js" />
    <link rel="modulepreload" href="./src/js/core/JSONLoader.js" />
    <link rel="modulepreload" href="./src/js/core/Sections.js" />
    <link rel="modulepreload" href="./src/js/ui/Renderer.js" />
    <link rel="modulepreload" href="./src/js/ui/PopupHandler.js" />
    <link rel="modulepreload" href="./src/js/ui/SideNav.js" />
    <link rel="modulepreload" href="./src/js/ui/popup/Popup.js" />
    <link rel="modulepreload" href="./src/js/ui/popup/PopupBlocks.js" />
    <link rel="modulepreload" href="./src/js/ui/popup/PopupModels.js" />
    <link rel="modulepreload" href="./src/js/ui/sections/ExperienceSection.js" />
    <link rel="modulepreload" href="./src/js/ui/sections/FeaturedSection.js" />
    <link rel="modulepreload" href="./src/js/ui/sections/ProjectsSection.js" />
    <link rel="modulepreload" href="./src/js/ui/sections/SkillsSection.js" />
    <link rel="modulepreload" href="./src/js/ui/elements/Media.js" />
    <link rel="modulepreload" href="./src/js/ui/elements/MediaCarousel.js" />

    <link rel="modulepreload" href="./src/js/ui/elements/CapsuleCarousel/CapsuleType.js" />

    <link rel="preload" href="./data/home.json" as="fetch" crossorigin />
    <link rel="preload" href="./data/experience.json" as="fetch" crossorigin />
    <link rel="preload" href="./data/projects.json" as="fetch" crossorigin />
    <link rel="preload" href="./data/skills.json" as="fetch" crossorigin />
    <link rel="preload" href="./data/sections.json" as="fetch" crossorigin />
    <link rel="preload" href="./data/featured.json" as="fetch" crossorigin />
    <link rel="preload" href="./i18n/en.json" as="fetch" crossorigin />
</head>
<body id="app" aria-busy="true">

    <main>
        <section class="hero-page" id="hero-page" data-section="hero">
            <canvas id="particles-background"></canvas>
            <div class="hero-top" id="hero-top">
                <div class="hero-content">
                    <div class="gradient"></div>
                </div>
            </div>
            <div class="hero-center" id="hero-center">
                <div class="hero-content">
                    <div class="hero-text">
                        <h1 id="hero-title" class="header-title">
                            <span class="skeleton skeleton-line skeleton-title" style="--sk-w: 9em;" aria-hidden="true"></span>
                        </h1>

                        <ul id="hero-roles" class="hero-roles">
                            <li class="skeleton skeleton-line" style="--sk-w: 8em;" aria-hidden="true"></li>
                            <li class="skeleton skeleton-line" style="--sk-w: 7em;" aria-hidden="true"></li>
                        </ul>
                        <div id="hero-btn-cnt" class="hero-contact">
                            <span class="skeleton skeleton-pill" aria-hidden="true"></span>
                            <span class="skeleton skeleton-pill" aria-hidden="true"></span>
                        </div>
                    </div>

                    <div class="profile-shadow">
                        <img id="hero-pic" src="./src/media/profile/hero-pic.jpeg" class="profile-pic" alt=""
                            width="640" height="640" fetchpriority="high" decoding="async">
                    </div>
                </div>

            </div>
            <div class="hero-bottom" id="hero-bottom">
                <div class="hero-content">
                    <div class="gradient"></div>
                </div>
            </div>
        </section>

        <section class="background content"><div class="showcase-viewport">
            <section class="section-viewport" id="experience" data-section="experience">
                <h2 id="experience-title" class="title">
                    <span class="skeleton skeleton-line" style="--sk-w: 7em;" aria-hidden="true"></span>
                </h2>
                <div id="experiences-cnt" class="experiences-cnt">
                    <div class="skeleton-row" aria-hidden="true">
                        <span class="skeleton skeleton-logo"></span>
                        <div class="skeleton-stack">
                            <span class="skeleton skeleton-line" style="--sk-w: 12em;"></span>
                            <span class="skeleton skeleton-line skeleton-text" style="--sk-w: 8em;"></span>
                            <span class="skeleton skeleton-line skeleton-text" style="--sk-w: 6em;"></span>
                            <span class="skeleton skeleton-line skeleton-text" style="--sk-w: 70%;"></span>
                        </div>
                    </div>
                    <div class="skeleton-row" aria-hidden="true">
                        <span class="skeleton skeleton-logo"></span>
                        <div class="skeleton-stack">
                            <span class="skeleton skeleton-line" style="--sk-w: 10em;"></span>
                            <span class="skeleton skeleton-line skeleton-text" style="--sk-w: 7em;"></span>
                            <span class="skeleton skeleton-line skeleton-text" style="--sk-w: 6em;"></span>
                            <span class="skeleton skeleton-line skeleton-text" style="--sk-w: 60%;"></span>
                        </div>
                    </div>
                </div>
            </section>
        </div></section>

        <section class="featured-section background" id="featured" data-section="featured">
            <div class="featured-inner">
                <h2 id="featured-title" class="title">
                    <span class="skeleton skeleton-line" style="--sk-w: 9em;" aria-hidden="true"></span>
                </h2>
                <div id="featured-cnt">
                    <div class="skeleton-featured" aria-hidden="true">
                        <span class="skeleton skeleton-media"></span>
                        <div class="skeleton-stack">
                            <span class="skeleton skeleton-line skeleton-title" style="--sk-w: 60%;"></span>
                            <span class="skeleton skeleton-line skeleton-text"></span>
                            <span class="skeleton skeleton-line skeleton-text"></span>
                            <span class="skeleton skeleton-line skeleton-text" style="--sk-w: 70%;"></span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="background content"><div class="showcase-viewport">
            <section class="section-viewport" id="projects" data-section="projects">
                <h2 id="proj-title" class="title">
                    <span class="skeleton skeleton-line" style="--sk-w: 6em;" aria-hidden="true"></span>
                </h2>

                <div id="proj-cap-cnt">
                    <div class="skeleton-projects" aria-hidden="true">
                        <span class="skeleton skeleton-line" style="--sk-w: 5em;"></span>
                        <div class="skeleton-capsules">
                            <span class="skeleton skeleton-media"></span>
                            <span class="skeleton skeleton-media"></span>
                            <span class="skeleton skeleton-media"></span>
                            <span class="skeleton skeleton-media"></span>
                        </div>
                    </div>
                </div>
            </section>

            <div class="section-separator">
                <span class="section-separator__line"></span>
            </div>

            <section class="section-viewport" id="skills" data-section="skills">
                <h2 id="skills-title" class="title">
                    <span class="skeleton skeleton-line" style="--sk-w: 5em;" aria-hidden="true"></span>
                </h2>
                <p id="skills-subtitle" class="sub-title"></p>

                <div id="skills-cnt">
                    <div class="skeleton-skills" aria-hidden="true">
                        <div class="skeleton-stack">
                            <span class="skeleton skeleton-line" style="--sk-w: 5em;"></span>
                            <span class="skeleton skeleton-line skeleton-text" style="--sk-w: 90%;"></span>
                            <span class="skeleton skeleton-line skeleton-text" style="--sk-w: 70%;"></span>
                        </div>
                        <div class="skeleton-stack">
                            <span class="skeleton skeleton-line" style="--sk-w: 5em;"></span>
                            <span class="skeleton skeleton-line skeleton-text" style="--sk-w: 90%;"></span>
                            <span class="skeleton skeleton-line skeleton-text" style="--sk-w: 70%;"></span>
                        </div>
                        <div class="skeleton-stack">
                            <span class="skeleton skeleton-line" style="--sk-w: 5em;"></span>
                            <span class="skeleton skeleton-line skeleton-text" style="--sk-w: 90%;"></span>
                            <span class="skeleton skeleton-line skeleton-text" style="--sk-w: 70%;"></span>
                        </div>
                    </div>
                </div>
            </section>

            <div class="section-separator">
                <span class="section-separator__line"></span>
            </div>

            <section class="section-viewport" id="contact" data-section="about">
                <h2 id="about-title" class="text title">
                    <span class="skeleton skeleton-line" style="--sk-w: 6em;" aria-hidden="true"></span>
                </h2>
                <ul class="about-me-container">
                    <li id="about-desc" class="about-me-text">
                        <span class="skeleton skeleton-line skeleton-text" aria-hidden="true"></span>
                        <span class="skeleton skeleton-line skeleton-text" aria-hidden="true"></span>
                        <span class="skeleton skeleton-line skeleton-text" style="--sk-w: 70%;" aria-hidden="true"></span>
                        <span class="skeleton skeleton-line skeleton-text skeleton-gap" aria-hidden="true"></span>
                        <span class="skeleton skeleton-line skeleton-text" aria-hidden="true"></span>
                        <span class="skeleton skeleton-line skeleton-text" style="--sk-w: 55%;" aria-hidden="true"></span>
                    </li>
                </ul>
                <div id="about-contacts" class="contact-info" style="padding-bottom: 2rem;">
                    <span class="skeleton skeleton-line" style="--sk-w: 16em;" aria-hidden="true"></span>
                </div>

                <div id="about-buttons" class="social" style="justify-content: center;">
                    <span class="skeleton skeleton-icon" aria-hidden="true"></span>
                    <span class="skeleton skeleton-icon" aria-hidden="true"></span>
                    <span class="skeleton skeleton-icon" aria-hidden="true"></span>
                </div>
            </section>
        </div></section>
    </main>

    <footer class="site-footer" id="footer" data-section="footer">
        <div class="footer-inner">
            <div class="footer-contacts" role="contentinfo">
                <div class="social">
                    <a class="icon linkedin social-link" href="https://www.linkedin.com/in/lucascampo3333/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile"></a>
                    <a class="icon email social-link" href="mailto:campolucas2001@gmail.com" aria-label="Send email"></a>
                </div>

                <div class="contact-info">
                    <a href="mailto:campolucas2001@gmail.com" class="contact-link">campolucas2001@gmail.com</a>
                    <span class="contact-sep">•</span>
                    <a href="tel:+541127403576" class="contact-link">+54 11 2740-3576</a>
                </div>
            </div>
        </div>
    </footer>

    <template id="experience-row">
        <a class="exp-row" href="#">
            <img class="exp-logo" width="56" height="56" loading="lazy" decoding="async" alt="" />
            <div class="exp-main">
                <h3 class="exp-role"></h3>
                <p class="exp-company"></p>
                <p class="exp-dates"><span class="exp-period"></span><span class="exp-present"></span></p>
                <p class="exp-summary"></p>
                <span class="exp-more"></span>
            </div>
        </a>
    </template>

    <template id="game-carousel">
        <div class="carousel" data-carousel>
            <div class="carousel-viewport">
                <div class="carousel-img-cnt" img-cnt></div>
            </div>

            <div class="carousel-thumbs">
                <div class="carousel-thumbs-track" thumb-cnt></div>
                <div class="carousel-thumb-scroll">
                    <button class="left" data-prev aria-label="Scroll thumbnails left">‹</button>
                    <div class="carousel-thumb-scroll-track">
                        <div class="carousel-thumb-scroll-handle"></div>
                    </div>
                    <button class="right" data-next aria-label="Scroll thumbnails right">›</button>
                </div>
            </div>

            <div class="carousel-arrows">
                <button class="arrow left" data-prev aria-label="Previous"><span>‹</span></button>
                <div class="carousel-dots" dot-cnt></div>
                <button class="arrow right" data-next aria-label="Next"><span>›</span></button>
            </div>
        </div>
    </template>

    <template id="popup-skeleton">
        <div class="skeleton-exp skeleton-popup" aria-hidden="true">
            <span class="skeleton skeleton-line skeleton-title" style="--sk-w: 10em;"></span>
            <span class="skeleton skeleton-line skeleton-text" style="--sk-w: 8em;"></span>
            <div class="skeleton-exp-body">
                <span class="skeleton skeleton-media"></span>
                <div class="skeleton-stack">
                    <span class="skeleton skeleton-line skeleton-text"></span>
                    <span class="skeleton skeleton-line skeleton-text"></span>
                    <span class="skeleton skeleton-line skeleton-text" style="--sk-w: 70%;"></span>
                </div>
            </div>
        </div>
    </template>

    <template id="cap-carousel-temp">
        <div class="projects-carousel">
            <div class="title-grid">
                <div class="section-title"><span id="cap-carousel-title"></span></div>
            </div>
            <div class="carousel-container">
                <div class="carousel-items">
                    <div id="cap-cnt" class="focus">

                    </div>
                </div>
                <div class="carousel-thumbs"></div>
                <div class="arrow left hidden"><div></div></div>
                <div class="arrow right hidden"><div></div></div>
            </div>
        </div>
    </template>

    <template id="cap-game-el">
        <a id="cap-link" class="game-capsule" href="">
            <div class="capsule-img-cnt">
                <img id="cap-banner-img" class="capsule-img" alt="" loading="lazy" decoding="async" />
                <span id="cap-banner-video" class="capsule-video"></span>
            </div>
            <div class="info-cnt">
                <div id="cap-tag-cnt" class="info-tags"></div>
            </div>
        </a>
    </template>

    <template id="cap-web-el">
        <a id="cap-link" class="website-capsule" href="">
            <div class="capsule-img-cnt">
                <img id="cap-banner-img" alt="" loading="lazy" decoding="async" style="width: 100%;" />
            </div>
            <div class="info-cnt">
                <p id="cap-title"></p>
            </div>
        </a>
    </template>

    <script type="module" src="./src/js/core/App.js"></script>
    <script src="./src/js/particles/particles.js" defer></script>

</body>
</html>
