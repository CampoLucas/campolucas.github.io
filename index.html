    <script>
        (function () {
            var lang = new URLSearchParams(location.search).get("lang") || "en";
            if (!/^[a-z-]+$/i.test(lang)) lang = "en";
            document.documentElement.lang = lang === "jp" ? "ja" : lang;

            if (lang !== "en") {
                var link = document.createElement("link");
                link.rel = "preload";
                link.as = "fetch";
                link.crossOrigin = "anonymous";
                link.href = "./i18n/" + lang + ".json";
                document.head.appendChild(link);
            }
        })();
    </script>

    <style id="theme">:root{--page-bg:#1A1D27;--hero-page-bg:#0F1117;--text:#E8E8ED;--accent-color1:#7C5CFF;--accent-color2:#3DDC97;--surface:color-mix(in srgb, var(--text) 5%, transparent);--surface-raised:color-mix(in srgb, var(--text) 10%, transparent);--border:color-mix(in srgb, var(--text) 10%, transparent);--text-muted:color-mix(in srgb, var(--text) 60%, transparent);--tag-bg:color-mix(in srgb, var(--text) 14%, transparent);--tag-text:color-mix(in srgb, var(--text) 85%, transparent);--display-tag-bg:color-mix(in srgb, var(--text) 22%, transparent);--display-tag-text:var(--text);--overlay:color-mix(in srgb, var(--page-bg) 55%, transparent);--band-experience:var(--page-bg);--band-featured:color-mix(in srgb, var(--page-bg) 88%, var(--accent-color1));--band-projects:color-mix(in srgb, var(--page-bg) 89%, var(--text));--band-skills:color-mix(in srgb, var(--page-bg) 88%, var(--accent-color2));--band-about:color-mix(in srgb, var(--page-bg) 86%, var(--text));--band-custom-a:color-mix(in srgb, var(--page-bg) 94%, var(--accent-color2));--band-custom-b:color-mix(in srgb, var(--page-bg) 94%, var(--accent-color1));--font-hero:"Space Grotesk", sans-serif;--font-section-title:"Space Grotesk", sans-serif;--font-row-title:"Space Grotesk", sans-serif;--font-body:"Inter", sans-serif;--font-label:"Inter", sans-serif;}</style>
<!--theme:end-->

<body id="app" aria-busy="true">

    <header class="hero" id="hero-page" data-section="hero">
        <div class="hero__inner">
            <div class="hero__top">
                <div class="hero__text">
                    <h1 id="hero-title" class="hero__name">
                        <span class="skeleton skeleton-fill" style="--sk-h: 55px; --sk-r: 10px;" aria-hidden="true"></span>
                    </h1>
                    <p id="hero-roles" class="hero__roles">
                        <span class="skeleton skeleton-fill" style="--sk-h: 38px; --sk-r: 10px;" aria-hidden="true"></span>
                    </p>
                </div>
                <div class="hero__avatar">
                    <img id="hero-pic" src="./src/media/profile/hero-pic.jpeg" class="hero__pic" alt=""
                        width="640" height="640" fetchpriority="high" decoding="async">
                </div>
            </div>
            <p id="hero-description" class="hero__description">
                <span class="skeleton skeleton-fill" style="--sk-h: 93px; --sk-r: 10px;" aria-hidden="true"></span>
            </p>
            <nav id="hero-links" class="hero__links">
                <span class="skeleton skeleton-icon" aria-hidden="true"></span>
                <span class="skeleton skeleton-icon" aria-hidden="true"></span>
                <span class="skeleton skeleton-icon" aria-hidden="true"></span>
                <span class="skeleton skeleton-icon" aria-hidden="true"></span>
            </nav>
        </div>
    </header>

    <div class="page">
        <main class="column">

            <section class="section section--experience fade" id="experience" data-section="experience" aria-labelledby="experience-title">
                <h2 id="experience-title" class="section-title">
                    <span class="skeleton skeleton-title" aria-hidden="true"></span>
                </h2>
                <ul id="experiences-cnt" class="entry-list">
                    <li class="skeleton skeleton-entry" aria-hidden="true"></li>
                    <li class="skeleton skeleton-entry" aria-hidden="true"></li>
                </ul>
            </section>

            <div class="section-group fade">
                <section class="featured" id="featured" data-section="featured" aria-labelledby="featured-title">
                    <h2 id="featured-title" class="section-title">
                        <span class="skeleton skeleton-title" aria-hidden="true"></span>
                    </h2>
                    <div id="featured-cnt">
                        <div class="featured__layout" aria-hidden="true">
                            <span class="skeleton skeleton-gallery"></span>
                            <span class="skeleton skeleton-panel"></span>
                        </div>
                        <span class="skeleton skeleton-indicator" aria-hidden="true"></span>
                    </div>
                </section>

                <section class="projects" id="projects" data-section="projects" aria-labelledby="proj-title">
                    <h2 id="proj-title" class="section-title">
                        <span class="skeleton skeleton-title" aria-hidden="true"></span>
                    </h2>
                    <div id="proj-cap-cnt">
                        <div class="category skeleton-category" aria-hidden="true">
                            <div class="skeleton-cards">
                                <span class="skeleton"></span>
                                <span class="skeleton"></span>
                                <span class="skeleton"></span>
                                <span class="skeleton"></span>
                            </div>
                            <span class="skeleton skeleton-indicator"></span>
                        </div>
                        <div class="category skeleton-category" aria-hidden="true">
                            <div class="skeleton-cards">
                                <span class="skeleton"></span>
                                <span class="skeleton"></span>
                                <span class="skeleton"></span>
                                <span class="skeleton"></span>
                            </div>
                            <span class="skeleton skeleton-indicator"></span>
                        </div>
                        <div class="category skeleton-category" aria-hidden="true">
                            <div class="skeleton-cards">
                                <span class="skeleton"></span>
                                <span class="skeleton"></span>
                                <span class="skeleton"></span>
                                <span class="skeleton"></span>
                            </div>
                            <span class="skeleton skeleton-indicator"></span>
                        </div>
                    </div>
                </section>
            </div>

            <section class="section section--skills fade" id="skills" data-section="skills" aria-labelledby="skills-title">
                <h2 id="skills-title" class="section-title">
                    <span class="skeleton skeleton-title" aria-hidden="true"></span>
                </h2>
                <ul id="skills-cnt" class="entry-list">
                    <li class="skeleton skeleton-entry" aria-hidden="true"></li>
                    <li class="skeleton skeleton-entry" aria-hidden="true"></li>
                    <li class="skeleton skeleton-entry" aria-hidden="true"></li>
                    <li class="skeleton skeleton-entry" aria-hidden="true"></li>
                    <li class="skeleton skeleton-entry" aria-hidden="true"></li>
                </ul>
            </section>

            <section class="section section--about" id="about" data-section="about" aria-labelledby="about-title">
                <h2 id="about-title" class="section-title">
                    <span class="skeleton skeleton-title" aria-hidden="true"></span>
                </h2>
                <ul id="about-cnt" class="entry-list">
                    <li class="skeleton skeleton-entry" aria-hidden="true"></li>
                    <li class="skeleton skeleton-entry" aria-hidden="true"></li>
                    <li class="skeleton skeleton-entry" aria-hidden="true"></li>
                </ul>
            </section>

        </main>
    </div>

    <footer class="footer" id="footer" data-section="footer">
        <p id="footer-title" class="footer__title"></p>
        <a id="footer-email" class="footer__email" href="mailto:campolucas2001@gmail.com"></a>
        <p id="footer-copy" class="footer__copy"></p>
    </footer>

    <template id="game-carousel">
        <div class="carousel" data-carousel>
            <div class="carousel-viewport">
                <div class="carousel-img-cnt" img-cnt></div>
            </div>

            <div class="carousel-thumbs">
                <div class="carousel-thumbs-track" thumb-cnt></div>
                <div class="carousel-thumb-scroll">
                    <button class="left" data-prev aria-label="Scroll thumbnails left">‹</button>
                    <div class="carousel-thumb-scroll-track">
                        <div class="carousel-thumb-scroll-handle"></div>
                    </div>
                    <button class="right" data-next aria-label="Scroll thumbnails right">›</button>
                </div>
            </div>

            <div class="carousel-arrows">
                <button class="arrow left" data-prev aria-label="Previous"><span>‹</span></button>
                <div class="carousel-dots" dot-cnt></div>
                <button class="arrow right" data-next aria-label="Next"><span>›</span></button>
            </div>
        </div>
    </template>

    <template id="popup-skeleton">
        <div class="skeleton-exp skeleton-popup" aria-hidden="true">
            <span class="skeleton skeleton-line skeleton-title-line" style="--sk-w: 10em;"></span>
            <span class="skeleton skeleton-line skeleton-text" style="--sk-w: 8em;"></span>
            <div class="skeleton-exp-body">
                <span class="skeleton skeleton-media"></span>
                <div class="skeleton-stack">
                    <span class="skeleton skeleton-line skeleton-text"></span>
                    <span class="skeleton skeleton-line skeleton-text"></span>
                    <span class="skeleton skeleton-line skeleton-text" style="--sk-w: 70%;"></span>
                </div>
            </div>
        </div>
    </template>

    <script type="module" src="./src/js/core/App.js"></script>
